name: Build Click Vlog Hub APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web Folder & Setup Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp -f *.png www/ 2>/dev/null || true
          cp -f *.mp4 www/ 2>/dev/null || true
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.clickvloghub.app",
            "appName": "Click Vlog Hub",
            "webDir": "www"
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClickVlogHub-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
